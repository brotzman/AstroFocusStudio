name: Build and test Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Nach erfolgreichem Build Tag und GitHub Release veröffentlichen'
        required: true
        default: false
        type: boolean
      release_tag:
        description: 'Release-Tag; muss zur PRODUCT_VERSION passen'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: astrofocus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WIX_VERSION: '5.0.2'

jobs:
  metadata:
    name: Read repository version
    runs-on: ubuntu-24.04
    outputs:
      product: ${{ steps.version.outputs.product }}
      bundle: ${{ steps.version.outputs.bundle }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Validate VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Invalid VERSION: $version" >&2; exit 2; }
          echo "product=$version" >> "$GITHUB_OUTPUT"
          echo "bundle=$version.0" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  native-tests:
    needs: metadata
    env:
      PRODUCT_VERSION: ${{ needs.metadata.outputs.product }}
    name: Native sanitizer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prepare sanitizer toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -f ./scripts/Run-NativeTests.sh
          sed -i 's/\r$//' ./scripts/Run-NativeTests.sh
          mkdir -p artifacts/native-test-logs

          compiler=''
          for candidate in /usr/bin/clang++-18 /usr/bin/clang++-17 /usr/bin/clang++-16; do
            if [[ -x "$candidate" ]]; then
              compiler="$candidate"
              break
            fi
          done
          if [[ -z "$compiler" ]]; then
            candidate="$(command -v clang++ || true)"
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              compiler="$candidate"
            fi
          fi
          if [[ -z "$compiler" ]]; then
            echo 'No usable Clang C++ compiler was found on the runner.' | tee artifacts/native-test-logs/toolchain.log
            exit 2
          fi

          echo "CXX=$compiler" >> "$GITHUB_ENV"
          {
            echo "Selected compiler: $compiler"
            "$compiler" --version
            bash --version | head -n 1
            uname -a
          } | tee artifacts/native-test-logs/toolchain.log

      - name: Run ASan and UBSan tests
        shell: bash
        run: |
          set -o pipefail
          bash --noprofile --norc ./scripts/Run-NativeTests.sh 2>&1 | tee artifacts/native-test-logs/native-sanitizers.log

      - name: Upload native sanitizer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AstroFocusStudio-${{ env.PRODUCT_VERSION }}-Native-Sanitizer-Logs
          path: artifacts/native-test-logs/
          if-no-files-found: error
          retention-days: 14

  windows-build:
    name: Build Windows binaries and packages
    needs: [metadata, native-tests]
    env:
      PRODUCT_VERSION: ${{ needs.metadata.outputs.product }}
      BUNDLE_VERSION: ${{ needs.metadata.outputs.bundle }}
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up .NET SDK for WiX
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -File -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            foreach ($error in $errors) {
              Write-Error "$($_.FullName): $($error.Message)"
              $failed = $true
            }
          }
          if ($failed) { throw 'PowerShell syntax validation failed.' }

      - name: Prepare CI diagnostics
        shell: powershell
        run: |
          $logDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts\test-logs'
          New-Item -ItemType Directory -Force -Path $logDirectory | Out-Null
          @(
            'AstroFocus Studio Windows CI diagnostics',
            "UTC: $([DateTime]::UtcNow.ToString('o'))",
            "Workspace: $env:GITHUB_WORKSPACE"
          ) | Set-Content -LiteralPath (Join-Path $logDirectory 'preflight.log') -Encoding utf8

      - name: Remove superseded version files
        shell: powershell
        run: |
          $repositoryRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $cleanupScript = Join-Path $repositoryRoot 'scripts\remove_legacy_version_files.py'
          $cleanupLog = Join-Path $repositoryRoot 'artifacts\test-logs\legacy-version-cleanup.log'
          if (-not (Test-Path -LiteralPath $cleanupScript -PathType Leaf)) {
            throw "Legacy-version cleanup script is missing: $cleanupScript"
          }
          & python -B -X utf8 $cleanupScript --root $repositoryRoot --log $cleanupLog
          if ($LASTEXITCODE -ne 0) {
            throw "Legacy-version cleanup failed with exit code $LASTEXITCODE. Log: $cleanupLog"
          }

      - name: Verify repository build entry points
        shell: powershell
        run: |
          $repositoryRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $log = Join-Path $repositoryRoot 'artifacts\test-logs\preflight.log'
          $requiredFiles = @(
            'scripts\Build-GitHubArtifacts.ps1',
            'scripts\Run-PythonTests.ps1',
            'scripts\remove_legacy_version_files.py',
            'scripts\Test-GitHubInstaller.ps1',
            'scripts\Run-NativeTests.sh',
            'tests\github_workflow_validation.py',
            'tests\version_consistency_validation.py',
            'tests\continuous_focus_validation.py',
            'tests\continuous_focus_layout_validation.py',
            'tests\frontend_startup_resilience_validation.py',
            'tests\frontend_settings_persistence_validation.py',
            'tests\continuous_focus_logic_validation.cpp',
            'build-all-windows-x64.bat',
            'frontend\build-windows-x64.bat',
            'frontend\kernel32.def',
            'common\security_entry.cpp',
            'common\continuous_focus_logic.h',
            'installer\build-wix.ps1',
            'installer\wix\Package.wxs',
            'installer\wix\Bundle.wxs',
            'installer\AstroFocusSetup.ps1',
            'updater\AstroFocusUpdater.ps1',
            'updater\update-public-key.cer',
            'release\New-ReleaseManifest.ps1',
            'README_DE.md',
            'KNOWN_LIMITATIONS.txt',
            'UNSIGNED_DEVELOPMENT_BUILD.txt'
          )
          $optionalMetadata = @('.gitattributes', '.gitignore')
          $missingFiles = @()
          $missingOptional = @()
          foreach ($relativePath in $requiredFiles) {
            $fullPath = Join-Path $repositoryRoot $relativePath
            if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
              $missingFiles += $relativePath
            }
          }
          foreach ($relativePath in $optionalMetadata) {
            $fullPath = Join-Path $repositoryRoot $relativePath
            if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
              $missingOptional += $relativePath
            }
          }

          "Repository root: $repositoryRoot" | Tee-Object -FilePath $log -Append | Write-Host
          if (Test-Path -LiteralPath (Join-Path $repositoryRoot 'scripts')) {
            $scriptListing = Get-ChildItem -LiteralPath (Join-Path $repositoryRoot 'scripts') -Force |
              Sort-Object Name | Format-Table Name, Length -AutoSize | Out-String
            $scriptListing | Tee-Object -FilePath $log -Append | Write-Host
          }
          if ($missingOptional.Count -gt 0) {
            $warning = "Optional repository metadata is missing and will not block the build: $($missingOptional -join ', ')"
            Write-Warning $warning
            $warning | Add-Content -LiteralPath $log -Encoding utf8
          }
          if ($missingFiles.Count -gt 0) {
            $message = "Required build files are missing from this commit: $($missingFiles -join ', ')"
            $message | Add-Content -LiteralPath $log -Encoding utf8
            throw $message
          }
          'Repository build entry-point validation passed.' |
            Tee-Object -FilePath $log -Append | Write-Host

      - name: Build all binaries and WiX packages
        shell: powershell
        run: |
          $repositoryRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $buildScript = Join-Path $repositoryRoot 'scripts\Build-GitHubArtifacts.ps1'
          $log = Join-Path $repositoryRoot 'artifacts\test-logs\build-package.log'
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          if (-not (Test-Path -LiteralPath $buildScript -PathType Leaf)) {
            throw "Build script is missing from the checked-out commit: $buildScript"
          }
          if (-not (Test-Path -LiteralPath $windowsPowerShell -PathType Leaf)) {
            throw "Windows PowerShell 5.1 was not found: $windowsPowerShell"
          }
          try {
            & $windowsPowerShell `
              -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File $buildScript `
              -ProductVersion $env:PRODUCT_VERSION `
              -BundleVersion $env:BUNDLE_VERSION `
              -WixVersion $env:WIX_VERSION 2>&1 | Tee-Object -FilePath $log
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              throw "Build-GitHubArtifacts.ps1 failed with exit code $exitCode."
            }
          } catch {
            $_ | Format-List * -Force | Out-String | Tee-Object -FilePath $log -Append | Write-Host
            throw
          }

      - name: Stage isolated installer-test package
        shell: powershell
        run: |
          $repositoryRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $ciRoot = Join-Path $repositoryRoot 'artifacts\ci-package'
          Remove-Item -LiteralPath $ciRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force `
            -Path (Join-Path $ciRoot 'dist'), (Join-Path $ciRoot 'artifacts\payload') | Out-Null
          Copy-Item -Path (Join-Path $repositoryRoot 'dist\*') -Destination (Join-Path $ciRoot 'dist') -Force
          Copy-Item -LiteralPath (Join-Path $repositoryRoot 'artifacts\payload\release-manifest.json') `
            -Destination (Join-Path $ciRoot 'artifacts\payload\release-manifest.json') -Force

      - name: Upload Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: AstroFocusStudio-${{ env.PRODUCT_VERSION }}-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload isolated installer-test package
        uses: actions/upload-artifact@v7
        with:
          name: AstroFocusStudio-${{ env.PRODUCT_VERSION }}-Installer-Test-Input
          path: artifacts/ci-package/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AstroFocusStudio-${{ env.PRODUCT_VERSION }}-Build-Logs
          path: artifacts/test-logs/
          if-no-files-found: warn
          retention-days: 14

  bundle-test:
    name: Test Burn bundle on clean Windows runner
    needs: [metadata, windows-build]
    env:
      PRODUCT_VERSION: ${{ needs.metadata.outputs.product }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out test script
        uses: actions/checkout@v7

      - name: Download installer-test input
        uses: actions/download-artifact@v8
        with:
          name: AstroFocusStudio-${{ env.PRODUCT_VERSION }}-Installer-Test-Input
          path: ci-input

      - name: Install, repair and uninstall Burn bundle
        shell: powershell
        run: |
          $testRoot = Join-Path $env:GITHUB_WORKSPACE 'ci-input'
          .\scripts\Test-GitHubInstaller.ps1 `
            -ProductVersion $env:PRODUCT_VERSION `
            -Mode Bundle `
            -RepositoryRoot $testRoot

      - name: Upload Burn bundle test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AstroFocusStudio-${{ env.PRODUCT_VERSION }}-Bundle-Test-Logs
          path: ci-input/artifacts/test-logs/
          if-no-files-found: warn
          retention-days: 14

  msi-test:
    name: Test raw MSI on clean Windows runner
    needs: [metadata, windows-build]
    env:
      PRODUCT_VERSION: ${{ needs.metadata.outputs.product }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out test script
        uses: actions/checkout@v7

      - name: Download installer-test input
        uses: actions/download-artifact@v8
        with:
          name: AstroFocusStudio-${{ env.PRODUCT_VERSION }}-Installer-Test-Input
          path: ci-input

      - name: Install, repair and uninstall raw MSI
        shell: powershell
        run: |
          $testRoot = Join-Path $env:GITHUB_WORKSPACE 'ci-input'
          .\scripts\Test-GitHubInstaller.ps1 `
            -ProductVersion $env:PRODUCT_VERSION `
            -Mode Msi `
            -RepositoryRoot $testRoot

      - name: Upload raw MSI test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AstroFocusStudio-${{ env.PRODUCT_VERSION }}-MSI-Test-Logs
          path: ci-input/artifacts/test-logs/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish tag and GitHub release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    needs: [metadata, windows-build, bundle-test, msi-test]
    env:
      PRODUCT_VERSION: ${{ needs.metadata.outputs.product }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified Windows release files
        uses: actions/download-artifact@v8
        with:
          name: AstroFocusStudio-${{ env.PRODUCT_VERSION }}-Windows-x64
          path: release-files

      - name: Verify release checksums
        working-directory: release-files
        run: sha256sum --check SHA256SUMS.txt

      - name: Resolve and validate release tag
        id: release_tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          expected_tag="${{ needs.metadata.outputs.tag }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="${REQUESTED_TAG:-$expected_tag}"
          fi
          if [[ -z "$release_tag" ]]; then
            echo 'No release tag was supplied.' >&2
            exit 2
          fi
          if [[ "$release_tag" != "$expected_tag" ]]; then
            echo "Release tag $release_tag does not match PRODUCT_VERSION $PRODUCT_VERSION; expected $expected_tag." >&2
            exit 2
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Validated release tag: $release_tag"

      - name: Create tag release or update existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Publishing verified release assets to $GH_REPO at tested commit $GITHUB_SHA"
          if gh release view --repo "$GH_REPO" "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload --repo "$GH_REPO" "$RELEASE_TAG" release-files/* --clobber
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create --repo "$GH_REPO" "$RELEASE_TAG" release-files/* \
              --title "AstroFocus Studio $RELEASE_TAG" \
              --generate-notes
          else
            gh release create --repo "$GH_REPO" "$RELEASE_TAG" release-files/* \
              --target "$GITHUB_SHA" \
              --title "AstroFocus Studio $RELEASE_TAG" \
              --generate-notes
          fi
